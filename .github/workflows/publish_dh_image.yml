name: Publish Digital Hub Chatwoot image

on:
  push:
    branches:
      - dh/v4.19.1
      - cursor/whatsapp-cloud-groups-b581
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/digitalhub-company/chatwoot

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immutable image tags
        id: tags
        run: |
          short="${GITHUB_SHA::12}"
          echo "release=${IMAGE}:v4.19.1-dh.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=${IMAGE}:sha-${short}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.tags.outputs.release }}
            ${{ steps.tags.outputs.sha }}
